# PorteCoulissante plugin configuration

# Enables entity movement detection (e.g., players, mobs)
entityMoving: true

# Allows portcullis gates to float without full frame support
allowFloating: true

# Delay in ticks before hoisting begins (default: 40)
hoistingDelay: 40

# Delay in ticks before dropping begins (default: 10)
droppingDelay: 10

# Trace logging level: OFF, BASIC, VERBOSE, DEBUG
trace-logging-level: OFF

# Optional loging enabled
debugLogging: extra

# Materials used for portcullis gates
portcullisMaterials: []

# Materials allowed as redstone power blocks (empty = allow all predefined power blocks)
powerBlocks: []

# Allow all frame materials to count as conductive
allowFrameBlocksAsConductive: true

# Allow to set basic frame materials (empty = allow all predefined frame blocks)
basicFrameMaterials: []

# Additional materials allowed for wall frames (empty = use defaults)
additionalFrameMaterials: []

# Sound URLs for portcullis movement
startSoundURL: http://mc.pepsoft.org/plugins/portecoulissante/sounds/portcullis_start.wav
upSoundURL: http://mc.pepsoft.org/plugins/portecoulissante/sounds/portcullis_up.wav
downSoundURL: http://mc.pepsoft.org/plugins/portecoulissante/sounds/portcullis_down.wav

# Sound effect settings
soundEffectDistance: 24
soundEffectVolume: 50